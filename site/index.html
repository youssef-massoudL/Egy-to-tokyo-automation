<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kanz Market Close</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url("fonts/IBM-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Sans Arabic"; src: url("fonts/IBM-Medium.ttf"); font-weight: 500; }
  @font-face { font-family: "Thmanyah Display"; src: url("fonts/ThmanyahDisplay-Bold.woff2"); font-weight: 700; }
  :root {
    --bg: #08070b; --surface: #141217; --line: #281339; --text: #eee6f2; --muted: #9a95a0;
    --lav: #d5adef; --loss: #e5534b; --closed: #6f6a75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 "IBM Plex Sans Arabic", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  header.top img { height: 28px; }
  .tabs { display: flex; gap: 8px; margin: 20px 0 28px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-weight: 500; color: var(--muted); background: transparent; border: 1px solid var(--line);
                 border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: #11081a; background: var(--lav); border-color: var(--lav); }
  .tabs button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .tabs.sub { gap: 4px; margin: 0 0 28px; padding-bottom: 0; border-bottom: 1px solid var(--line); }
  .tabs.sub button { border: 0; border-radius: 0; padding: 8px 14px 10px; margin-bottom: -1px; border-bottom: 2px solid transparent; }
  .tabs.sub button[aria-selected="true"] { color: var(--lav); background: transparent; border-bottom-color: var(--lav); }
  .kick { color: var(--lav); font-weight: 500; font-size: 14px; }
  h1 { font: 700 clamp(28px, 6vw, 44px)/1.15 "Thmanyah Display", "IBM Plex Sans Arabic", sans-serif; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  video { width: 100%; aspect-ratio: 9 / 16; background: var(--surface); border-radius: 14px; display: block; }
  .date { color: var(--muted); margin: 0 0 18px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; background: var(--lav); color: #11081a; font-weight: 500;
         padding: 14px 22px; border-radius: 10px; text-decoration: none; font-size: 17px; }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .note { display: inline-block; margin: 14px 0 0; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 26px; font-variant-numeric: tabular-nums; }
  td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
  td.n { text-align: left; direction: ltr; font-weight: 500; }
  .up { color: var(--lav); } .down { color: var(--loss); } .off { color: var(--closed); }
  h2 { font-size: 18px; font-weight: 500; margin: 48px 0 12px; }
  .archive a { color: var(--text); text-decoration: none; display: flex; justify-content: space-between; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .archive a:hover { color: var(--lav); }
  .archive span { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .empty { color: var(--muted); }
  .post { margin: 0 0 56px; }
  .post h2 { margin: 0 0 4px; font-size: 22px; }
  .post h2.arch { margin: 36px 0 8px; font-size: 18px; }
  .shots { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 200px); gap: 16px; align-items: start; margin-top: 8px; }
  @media (max-width: 720px) { .shots { grid-template-columns: minmax(0, 1fr) minmax(0, 120px); gap: 10px; } }
  .shots a { display: block; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  .shots a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .shots img { display: block; width: 100%; height: auto; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn.ghost { background: transparent; color: var(--lav); border: 1px solid var(--lav); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="kick">Kanz · Market close reels</div>
    <img src="kanz-white.png" alt="Kanz">
  </header>
  <div class="tabs" role="tablist" aria-label="المحتوى">
    <button role="tab" id="t-videos" aria-controls="videos" aria-selected="true">الفيديوهات</button>
    <button role="tab" id="t-posts" aria-controls="posts" aria-selected="false">منشورات الإغلاق</button>
  </div>

  <section id="videos" role="tabpanel" aria-labelledby="t-videos">
    <div class="tabs sub" role="tablist" aria-label="الفيديوهات">
      <button role="tab" id="t-egx" aria-controls="egx" aria-selected="true">من القاهرة لطوكيو</button>
      <button role="tab" id="t-us" aria-controls="us" aria-selected="false">من أوروبا لنيويورك</button>
    </div>
    <section id="egx" role="tabpanel" aria-labelledby="t-egx" data-kick="أداء الأسواق" data-title="من القاهرة لطوكيو"></section>
    <section id="us" role="tabpanel" aria-labelledby="t-us" data-kick="أسواق الغرب" data-title="من أوروبا لنيويورك" hidden></section>
  </section>

  <section id="posts" role="tabpanel" aria-labelledby="t-posts" hidden>
    <div class="tabs sub" role="tablist" aria-label="منشورات الإغلاق">
      <button role="tab" id="t-post-tasi" aria-controls="post-tasi" aria-selected="true">السعودية</button>
      <button role="tab" id="t-post-egx" aria-controls="post-egx" aria-selected="false">مصر</button>
      <button role="tab" id="t-post-us" aria-controls="post-us" aria-selected="false">أمريكا</button>
    </div>
    <section id="post-tasi" role="tabpanel" aria-labelledby="t-post-tasi" data-kick="منشور الإغلاق · تاسي" data-title="السوق السعودية"></section>
    <section id="post-egx" role="tabpanel" aria-labelledby="t-post-egx" data-kick="منشور الإغلاق · EGX30" data-title="البورصة المصرية" hidden></section>
    <section id="post-us" role="tabpanel" aria-labelledby="t-post-us" data-kick="منشور الإغلاق · إس آند بي 500 وداو جونز وناسداك 100" data-title="السوق الأمريكية" hidden></section>
  </section>
</main>
<script>
const NAMES = {
  egx30: "EGX30 · مصر", tasi: "تاسي · السعودية", dfmgi: "سوق دبي", fadgi: "فوتسي أبوظبي", nifty: "نيفتي 50 · الهند",
  hsi: "هانج سنج · هونج كونج", kospi: "كوسبي 200 · كوريا", n225: "نيكاي 225 · اليابان",
  dax: "داكس · ألمانيا", cac: "كاك 40 · فرنسا", ftse: "فوتسي 100 · بريطانيا", dow: "داو جونز", spx: "إس آند بي 500", ndq: "ناسداك",
  brent: "برنت", gold: "الذهب" };
const NOTES = { "SINGLE SOURCE": "مصدر واحد (Yahoo) · single source, numbers not cross-checked",
                "TEST": "تجربة · test run, numbers are not a real close" };

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function build(sec) {
  const ed = sec.id;
  const head = el("div");
  head.append(el("div", "kick", sec.dataset.kick), el("h1", null, sec.dataset.title));
  const grid = el("div", "grid");
  const video = el("video");
  Object.assign(video, { controls: true, playsInline: true, preload: "metadata", poster: `${ed}/latest.jpg` });
  const side = el("section");
  const date = el("p", "date", "…");
  const dl = el("a", "btn", "تحميل الفيديو MP4 ↓");
  dl.href = `${ed}/latest.mp4`;
  const status = el("div");
  const table = el("table");
  side.append(date, dl, status, table);
  grid.append(video, side);
  const arch = el("div", "archive");
  sec.append(head, el("div", null), grid, el("h2", null, "الأيام السابقة · Archive"), arch);
  head.style.marginBottom = "24px";

  fetch(`${ed}/latest.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
    video.src = `${ed}/latest.mp4`;
    date.textContent = `${d.weekday} ${d.date_ar} · ${d.date}`;
    dl.setAttribute("download", d.file);
    if (d.status !== "OK") status.append(el("p", "note", NOTES[d.status] || d.status));
    for (const r of d.rows) {
      const tr = table.insertRow();
      tr.insertCell().textContent = NAMES[r.key] || r.key;
      const c = tr.insertCell();
      c.className = "n " + (r.closed ? "off" : r.pct >= 0 ? "up" : "down");
      c.textContent = r.closed ? "مغلق" : (r.pct > 0 ? "+" : "") + r.pct.toFixed(2) + "%";
    }
  }).catch(() => { date.textContent = "لا يوجد فيديو بعد · No reel published yet."; dl.hidden = true; video.hidden = true; });

  releases.then(list => {
    const items = list.filter(r => !r.draft && r.tag_name.startsWith(ed + "-") && !r.tag_name.includes("-test"))
      .map(r => [r, r.assets.find(a => a.name.endsWith(".mp4"))]).filter(x => x[1]);
    if (!items.length) { arch.append(el("p", "empty", "Nothing yet.")); return; }
    for (const [r, a] of items) {
      const link = el("a");
      link.href = a.browser_download_url;
      link.append(el("b", null, r.name), el("span", null, (a.size / 1e6).toFixed(1) + " MB · MP4 ↓"));
      arch.append(link);
    }
  }).catch(() => arch.append(el("p", "empty", "Archive unavailable right now.")));
}

// archive = public GitHub releases of this repo (drafts never appear)
const repo = location.hostname.split(".")[0] + "/" + location.pathname.split("/")[1];
const releases = fetch(`https://api.github.com/repos/${repo}/releases?per_page=100`).then(r => r.json());
// close posts: the latest wide (16:9) and tall (9:16) image per market, made by the "Market close post" workflow
function buildPost(sec) {
  const mk = sec.id.slice(5), title = sec.dataset.title;  // post-tasi -> tasi
  {
    const head = el("div");
    head.style.marginBottom = "12px";
    head.append(el("div", "kick", sec.dataset.kick), el("h1", null, title));
    const box = el("div", "post");
    const date = el("p", "date", "…");
    const status = el("div");
    const shots = el("div", "shots");
    const btns = el("div", "btns");
    const arch = el("div", "archive");
    box.append(date, status, shots, btns, el("h2", "arch", "الأيام السابقة · Archive"), arch);
    sec.append(head, box);
    fetch(`posts/${mk}/latest.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
      date.textContent = `${d.date_ar} · ${d.date}`;
      if (d.status !== "OK") status.append(el("p", "note", NOTES[d.status] || d.status));
      const v = encodeURIComponent(d.date);
      for (const [k, alt] of [["wide", "16:9"], ["tall", "9:16"]]) {
        const a = el("a");
        a.href = `posts/${mk}/${k}.png?v=${v}`;
        a.setAttribute("aria-label", `${title} ${alt}`);
        const img = el("img");
        Object.assign(img, { src: `posts/${mk}/${k}.jpg?v=${v}`, alt: `${title} ${d.date_ar} ${alt}`, loading: "lazy" });
        a.append(img);
        shots.append(a);
        const b = el("a", "btn" + (k === "tall" ? " ghost" : ""), `تحميل ${alt} PNG ↓`);
        b.href = `posts/${mk}/${k}.png?v=${v}`;
        b.setAttribute("download", d.files[k]);
        btns.append(b);
      }
    }).catch(() => { date.textContent = "لا يوجد منشور بعد · No post published yet."; });
    releases.then(list => {
      const items = list.filter(r => !r.draft && r.tag_name.startsWith(`post-${mk}-`) && !r.tag_name.includes("-test"));
      if (!items.length) { arch.append(el("p", "empty", "Nothing yet.")); return; }
      for (const r of items) {
        for (const a of r.assets.filter(a => a.name.endsWith(".png"))) {
          const link = el("a");
          link.href = a.browser_download_url;
          link.append(el("b", null, `${r.name} · ${a.name.includes("_wide") ? "16:9" : "9:16"}`), el("span", null, (a.size / 1e6).toFixed(1) + " MB · PNG ↓"));
          arch.append(link);
        }
      }
    }).catch(() => arch.append(el("p", "empty", "Archive unavailable right now.")));
  }
}
["egx", "us"].forEach(id => build(document.getElementById(id)));
["tasi", "egx", "us"].forEach(mk => buildPost(document.getElementById("post-" + mk)));

// two levels of tabs: الفيديوهات / منشورات الإغلاق, and inside each one tab per reel or market.
// The address keeps the inner tab (#egx, #us, #post-tasi, #post-egx, #post-us), so a link opens the right one.
const tabs = [...document.querySelectorAll("[role=tab]")];
const tabFor = id => tabs.find(t => t.getAttribute("aria-controls") === id);
function select(tab) {
  for (const t of tab.closest("[role=tablist]").querySelectorAll("[role=tab]")) {
    const on = t === tab;
    t.setAttribute("aria-selected", on);
    document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
  }
}
function current(panel) {  // the inner tab shown in an outer panel
  const t = panel.querySelector(".tabs.sub [aria-selected=true]");
  return t ? t.getAttribute("aria-controls") : panel.id;
}
function show(id) {
  const tab = tabFor(id);
  if (!tab) return;
  select(tab);
  const outer = tab.closest("section[role=tabpanel]");
  if (outer) select(tabFor(outer.id));
  try { history.replaceState(null, "", "#" + current(document.getElementById(id))); } catch (e) {}
}
tabs.forEach(t => t.addEventListener("click", () => show(t.getAttribute("aria-controls"))));
function fromHash() {
  const id = location.hash.slice(1);
  if (id && tabFor(id)) { show(id); requestAnimationFrame(() => window.scrollTo(0, 0)); }
}
fromHash();
window.addEventListener("hashchange", fromHash);
</script>
</body>
</html>
