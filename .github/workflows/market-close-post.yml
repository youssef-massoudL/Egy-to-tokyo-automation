name: Market close post
on:
  # Starts by itself whenever a reel run starts (the outside timer already calls those after each close), so no new timer is needed:
  #   Sun-Thu 13:30-16:30 Cairo (EGX reel)   -> Saudi + EGX posts
  #   Mon-Fri 15:15-18:30 New York (US reel) -> S&P 500, Dow Jones and Nasdaq 100 posts (a run before 16:00 waits for the close)
  # A reel run at any other time (tests) makes no post.
  workflow_run:
    workflows: ["Market close reel"]
    types: [requested]
  workflow_dispatch:
    inputs:
      market:
        description: "Which post"
        type: choice
        options: [tasi+egx, us, all, tasi, egx, spx, dji, ndx]
        default: tasi+egx
      test:
        description: "Test run: render now with whatever TradingView shows, no waiting (draft release tagged -test)"
        type: boolean
        default: true
      date:
        description: "Test runs only: pretend it is this session (YYYY-MM-DD HH:MM local), e.g. to remake Thursday's close on a Friday"
        type: string
        default: ""
      site:
        description: "Also put this run on the website (only matters for test runs; real runs update it automatically)"
        type: boolean
        default: false
      slack:
        description: "Also send this run to Slack (only matters for test runs; real runs always send)"
        type: boolean
        default: false
      redo:
        description: "Real run only: make today's posts again even if they were already made (replaces them, sends to Slack)"
        type: boolean
        default: false
concurrency:
  group: ${{ inputs.test && format('post-test-{0}', github.run_id) || 'close-post' }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
      TEST: ${{ inputs.test && '1' || '0' }}
      TEST_DATE: ${{ inputs.date }}
      SITE_TEST: ${{ inputs.site && 'true' || 'false' }}
      SLACK_TEST: ${{ inputs.slack && 'true' || 'false' }}
      REDO: ${{ inputs.redo && 'true' || 'false' }}
      PYTHONIOENCODING: utf-8
      KANZ_DB_URL: ${{ secrets.KANZ_DB_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID || secrets.CHANNEL || vars.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Guard (time window, which markets)
        id: guard
        run: |
          H=$(TZ=Africa/Cairo date +%H%M); DOW=$(TZ=Africa/Cairo date +%u)              # 1 Mon .. 5 Fri, 6 Sat, 7 Sun
          NH=$(TZ=America/New_York date +%H%M); NDOW=$(TZ=America/New_York date +%u)
          M=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "$DOW" -ne 5 ] && [ "$DOW" -ne 6 ] && [ "$H" -ge 1330 ] && [ "$H" -le 1630 ]; then M="tasi egx"; fi
            if [ "$NDOW" -le 5 ] && [ "$NH" -ge 1515 ] && [ "$NH" -le 1830 ]; then M="spx dji ndx"; fi
            [ -z "$M" ] && echo "reel run at $H Cairo / $NH New York: not a market close, no post"
          else
            case "${{ inputs.market }}" in
              tasi+egx) M="tasi egx" ;; us) M="spx dji ndx" ;; all) M="tasi egx spx dji ndx" ;; *) M="${{ inputs.market }}" ;;
            esac
          fi
          echo "tasi=$([[ " $M " == *" tasi "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "egx=$([[ " $M " == *" egx "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "us=$(for k in spx dji ndx; do [[ " $M " == *" $k "* ]] && printf '%s ' $k; done)" >> "$GITHUB_OUTPUT"
          echo "go=$([ -n "$M" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Keep Chromium between runs
        if: steps.guard.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-post-${{ runner.os }}
      - name: Install
        if: steps.guard.outputs.go == 'true'
        run: |
          pip install "playwright>=1.45" psycopg2-binary Pillow
          python -m playwright install --with-deps chromium
      - name: Configure website
        if: steps.guard.outputs.go == 'true'
        id: cfg
        uses: actions/configure-pages@v5

      # ---- Saudi: closes first (15:00 Riyadh = 14:00 Cairo in winter) ----
      - name: Saudi post
        id: tasi
        if: steps.guard.outputs.tasi == 'true'
        continue-on-error: true
        run: python post/run_one.py tasi
      - name: Website with the Saudi post
        if: steps.tasi.outputs.site == 'true'
        run: python post/build_site.py _site_tasi "${{ steps.cfg.outputs.base_url }}" post_result_tasi.json
      - name: Upload website (Saudi)
        if: steps.tasi.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_tasi
          name: github-pages-tasi-${{ github.run_attempt }}
      - name: Deploy website (Saudi)
        if: steps.tasi.outputs.site == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-tasi-${{ github.run_attempt }}

      # ---- Egypt ----
      - name: EGX post
        id: egx
        if: steps.guard.outputs.egx == 'true'
        continue-on-error: true
        run: python post/run_one.py egx
      - name: Let a running reel deploy first (the site is rebuilt from the live copy, so the newer deploy must come last)
        # Real runs only, and only reels already running: a queued reel builds its site later and carries the posts over itself.
        # Capped at 25 minutes; after that the post goes on the site anyway and the reel's own deploy carries it over.
        if: steps.egx.outputs.site == 'true' && env.TEST != '1'
        run: |
          for i in $(seq 1 25); do
            N=$(gh run list --workflow market-close-reel.yml --status in_progress --json databaseId -q 'length' 2>/dev/null || echo 0)
            [ "$N" = "0" ] && break
            echo "reel still running ($N), waiting ($i/25)"; sleep 60
          done
      - name: Website with the EGX post
        if: steps.egx.outputs.site == 'true'
        run: python post/build_site.py _site_egx "${{ steps.cfg.outputs.base_url }}" post_result_egx.json
      - name: Upload website (EGX)
        if: steps.egx.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_egx
          name: github-pages-egx-${{ github.run_attempt }}
      - name: Deploy website (EGX)
        if: steps.egx.outputs.site == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-egx-${{ github.run_attempt }}

      # ---- United States: S&P 500, Dow Jones, Nasdaq 100 (16:00 New York) ----
      - name: US posts
        id: us
        if: steps.guard.outputs.us != ''
        continue-on-error: true
        run: |
          FAIL=0
          for MK in ${{ steps.guard.outputs.us }}; do echo "::group::$MK"; python post/run_one.py $MK || FAIL=1; echo "::endgroup::"; done
          FILES=$(for MK in ${{ steps.guard.outputs.us }}; do [ -f post_site_$MK.ok ] && printf 'post_result_%s.json ' $MK; done)
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          exit $FAIL
      - name: Let a running reel deploy first (US)
        if: steps.us.outputs.files != '' && env.TEST != '1'
        run: |
          for i in $(seq 1 25); do
            N=$(gh run list --workflow market-close-reel.yml --status in_progress --json databaseId -q 'length' 2>/dev/null || echo 0)
            [ "$N" = "0" ] && break
            echo "reel still running ($N), waiting ($i/25)"; sleep 60
          done
      - name: Website with the US posts
        if: steps.us.outputs.files != ''
        run: python post/build_site.py _site_us "${{ steps.cfg.outputs.base_url }}" ${{ steps.us.outputs.files }}
      - name: Upload website (US)
        if: steps.us.outputs.files != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_us
          name: github-pages-us-${{ github.run_attempt }}
      - name: Deploy website (US)
        if: steps.us.outputs.files != ''
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-us-${{ github.run_attempt }}

      - name: Upload as run artifact too
        if: steps.guard.outputs.go == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: close-posts-${{ github.run_id }}
          path: out/posts/
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail the run if a post failed
        if: steps.tasi.outcome == 'failure' || steps.egx.outcome == 'failure' || steps.us.outcome == 'failure'
        run: |
          echo "Saudi: ${{ steps.tasi.outcome }}, EGX: ${{ steps.egx.outcome }}, US: ${{ steps.us.outcome }}"; exit 1
