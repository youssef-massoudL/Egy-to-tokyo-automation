name: Market close post
on:
  # Daily again from 2026-11-25 for Saudi + EGX: starts with every reel run, and posts only inside Sun-Thu 13:30-16:30 Cairo
  # (the reel's outside timer fires at 14:15 and 15:15; the second one is the backup and skips what is already made).
  # The US post stays manual (Actions -> Market close post -> Run workflow).
  workflow_run:
    workflows: ["Market close reel"]
    types: [requested]
  # pushing .github/post-test-run.json starts a test run of Saudi + EGX that also goes on the website.
  # It is always a test: never Slack, never social media, whatever the file says.
  push:
    branches: [main]
    paths: [".github/post-test-run.json"]
  workflow_dispatch:
    inputs:
      market:
        description: "Which post"
        type: choice
        options: [tasi+egx, us, all, tasi, egx]
        default: tasi+egx
      test:
        description: "Test run: render now with whatever TradingView shows, no waiting (draft release tagged -test)"
        type: boolean
        default: true
      date:
        description: "Test runs only: pretend it is this session (YYYY-MM-DD HH:MM local), e.g. to remake Thursday's close on a Friday"
        type: string
        default: ""
      site:
        description: "Also put this run on the website (only matters for test runs; real runs update it automatically)"
        type: boolean
        default: false
      slack:
        description: "Also send this run to Slack (only matters for test runs; real runs always send)"
        type: boolean
        default: false
      redo:
        description: "Real run only: make today's posts again even if they were already made (replaces them, sends to Slack)"
        type: boolean
        default: false
      social_test:
        description: "Test run only: private social test through Zernio (Facebook gets an unpublished draft, the rest is skipped)"
        type: boolean
        default: false
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.test) && format('post-test-{0}', github.run_id) || 'close-post' }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
    env:
      GH_TOKEN: ${{ github.token }}
      TEST: ${{ (inputs.test || github.event_name == 'push') && '1' || '0' }}
      TEST_DATE: ${{ inputs.date }}
      SITE_TEST: ${{ (inputs.site || github.event_name == 'push') && 'true' || 'false' }}
      SLACK_TEST: ${{ inputs.slack && 'true' || 'false' }}
      REDO: ${{ inputs.redo && 'true' || 'false' }}
      PYTHONIOENCODING: utf-8
      KANZ_DB_URL: ${{ secrets.KANZ_DB_URL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID || secrets.CHANNEL || vars.SLACK_CHANNEL_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Social media (post/social_post.py): the same switch, accounts and key as the reel.
      # To stop only these posts, set the repo variable CLOSE_POST_SOCIAL_ENABLED to false.
      SOCIAL_TEST: ${{ inputs.social_test && 'true' || 'false' }}
      ZERNIO_POST_ENABLED: ${{ github.event_name != 'push' && vars.CLOSE_POST_SOCIAL_ENABLED != 'false' && vars.ZERNIO_POST_ENABLED || 'false' }}
      ZERNIO_PLATFORMS: ${{ vars.ZERNIO_PLATFORMS }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY || secrets.ZERNIO }}
    steps:
      - name: Guard (time window, which markets)
        id: guard
        run: |
          H=$(TZ=Africa/Cairo date +%H%M); DOW=$(TZ=Africa/Cairo date +%u)              # 1 Mon .. 5 Fri, 6 Sat, 7 Sun
          M=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "$DOW" -ne 5 ] && [ "$DOW" -ne 6 ] && [ "$H" -ge 1330 ] && [ "$H" -le 1630 ]; then M="tasi egx"; fi
            [ -z "$M" ] && echo "reel run at $H Cairo: not the Saudi / EGX close, no post"
          elif [ "${{ github.event_name }}" = "push" ]; then
            M="tasi egx"
          else
            case "${{ inputs.market }}" in
              tasi+egx) M="tasi egx" ;; all) M="tasi egx us" ;; *) M="${{ inputs.market }}" ;;
            esac
          fi
          echo "tasi=$([[ " $M " == *" tasi "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "egx=$([[ " $M " == *" egx "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "us=$([[ " $M " == *" us "* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "go=$([ -n "$M" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
      - name: Keep Chromium between runs
        if: steps.guard.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-post-${{ runner.os }}
      - name: Install
        if: steps.guard.outputs.go == 'true'
        run: |
          pip install "playwright>=1.45" psycopg2-binary Pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg   # cover frame of a reel taken from its release
      - name: Configure website
        if: steps.guard.outputs.go == 'true'
        id: cfg
        uses: actions/configure-pages@v5

      # ---- Saudi: closes first (15:00 Riyadh = 14:00 Cairo in winter) ----
      - name: Saudi post
        id: tasi
        if: steps.guard.outputs.tasi == 'true'
        continue-on-error: true
        run: python post/run_one.py tasi
      - name: Website with the Saudi post
        if: steps.tasi.outputs.site == 'true'
        run: python post/build_site.py _site_tasi "${{ steps.cfg.outputs.base_url }}" post_result_tasi.json
      - name: Upload website (Saudi)
        if: steps.tasi.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_tasi
          name: github-pages-tasi-${{ github.run_attempt }}
      - name: Deploy website (Saudi)
        if: steps.tasi.outputs.site == 'true'
        continue-on-error: true
        uses: ./.github/actions/deploy-site
        with:
          artifact_name: github-pages-tasi-${{ github.run_attempt }}

      # ---- Egypt ----
      - name: EGX post
        id: egx
        if: steps.guard.outputs.egx == 'true'
        continue-on-error: true
        run: python post/run_one.py egx
      - name: Let a running reel deploy first (the site is rebuilt from the live copy, so the newer deploy must come last)
        # Real runs only, and only reels already running: a queued reel builds its site later and carries the posts over itself.
        # Capped at 25 minutes; after that the post goes on the site anyway and the reel's own deploy carries it over.
        if: steps.egx.outputs.site == 'true' && env.TEST != '1'
        run: |
          for i in $(seq 1 25); do
            N=$(gh run list --workflow market-close-reel.yml --status in_progress --json databaseId -q 'length' 2>/dev/null || echo 0)
            [ "$N" = "0" ] && break
            echo "reel still running ($N), waiting ($i/25)"; sleep 60
          done
      - name: Website with the EGX post
        if: steps.egx.outputs.site == 'true'
        run: python post/build_site.py _site_egx "${{ steps.cfg.outputs.base_url }}" post_result_egx.json
      - name: Upload website (EGX)
        if: steps.egx.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_egx
          name: github-pages-egx-${{ github.run_attempt }}
      - name: Deploy website (EGX)
        if: steps.egx.outputs.site == 'true'
        uses: ./.github/actions/deploy-site
        with:
          artifact_name: github-pages-egx-${{ github.run_attempt }}

      # ---- United States: one post with S&P 500, Dow Jones and Nasdaq 100 (16:00 New York) ----
      - name: US post
        id: us
        if: steps.guard.outputs.us == 'true'
        continue-on-error: true
        run: python post/run_one.py us
      - name: Let a running reel deploy first (US)
        if: steps.us.outputs.site == 'true' && env.TEST != '1'
        run: |
          for i in $(seq 1 25); do
            N=$(gh run list --workflow market-close-reel.yml --status in_progress --json databaseId -q 'length' 2>/dev/null || echo 0)
            [ "$N" = "0" ] && break
            echo "reel still running ($N), waiting ($i/25)"; sleep 60
          done
      - name: Website with the US post
        if: steps.us.outputs.site == 'true'
        run: python post/build_site.py _site_us "${{ steps.cfg.outputs.base_url }}" post_result_us.json
      - name: Upload website (US)
        if: steps.us.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site_us
          name: github-pages-us-${{ github.run_attempt }}
      - name: Deploy website (US)
        if: steps.us.outputs.site == 'true'
        uses: ./.github/actions/deploy-site
        with:
          artifact_name: github-pages-us-${{ github.run_attempt }}

      - name: Upload as run artifact too
        if: steps.guard.outputs.go == 'true' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: close-posts-${{ github.run_id }}
          path: out/posts/
          retention-days: 14
          if-no-files-found: ignore
      - name: Fail the run if a post failed
        if: steps.tasi.outcome == 'failure' || steps.egx.outcome == 'failure' || steps.us.outcome == 'failure'
        run: |
          echo "Saudi: ${{ steps.tasi.outcome }}, EGX: ${{ steps.egx.outcome }}, US: ${{ steps.us.outcome }}"; exit 1
