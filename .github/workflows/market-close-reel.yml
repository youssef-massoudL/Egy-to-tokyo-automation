name: Market close reel
on:
  schedule:
    # EGX (Cairo -> Tokyo): Sun-Thu. Cairo is UTC+2 in winter, UTC+3 in summer: two slots, the release-tag guard drops the duplicate.
    - cron: "15 11,12 * * 0-4"
    # Europe + US: Mon-Fri. New York is UTC-5 in winter, UTC-4 in summer: 15:35 / 16:35 New York in winter, 16:35 / 17:35 in summer.
    - cron: "35 20,21 * * 1-5"
  # pushing .github/test-run.json starts a test run that also goes on the website: {"edition": "egx" | "us"}
  push:
    branches: [main]
    paths: [".github/test-run.json"]
  workflow_dispatch:
    inputs:
      edition:
        description: "Which reel"
        type: choice
        options: [egx, us]
        default: egx
      test:
        description: "Test run: render now with whatever Yahoo has, no waiting for the close (draft release tagged -test)"
        type: boolean
        default: true
      site:
        description: "Also put this run on the website (only matters for test runs; real runs update it automatically)"
        type: boolean
        default: false
concurrency:
  group: close-${{ github.event.schedule == '35 20,21 * * 1-5' && 'us' || inputs.edition || github.event_name == 'push' && 'push' || 'egx' }}
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
    env:
      ED: ${{ github.event.schedule == '35 20,21 * * 1-5' && 'us' || github.event.schedule && 'egx' || inputs.edition }}
      RADAR_OUT: ${{ github.workspace }}/out
      GH_TOKEN: ${{ github.token }}
      RADAR_TEST: ${{ (inputs.test || github.event_name == 'push') && '1' || '0' }}
      SITE_TEST: ${{ (inputs.site || github.event_name == 'push') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Date and already-made guard
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ED=$(python -c "import json;print(json.load(open('.github/test-run.json'))['edition'])")
            echo "ED=$ED" >> "$GITHUB_ENV"
          fi
          if [ "$ED" = "us" ]; then D=$(TZ=America/New_York date +%F); else D=$(TZ=Africa/Cairo date +%F); fi
          echo "Edition $ED, date $D"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          if [ "$RADAR_TEST" = "1" ]; then
            echo "tag=$ED-$D-test-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$ED-$D" >/dev/null 2>&1; then
            echo "already made today"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$ED-$D" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.guard.outputs.skip == 'false'
        run: |
          pip install -r requirements.txt psycopg2-binary
          npm ci
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Too early check
        id: check
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [ "$RADAR_TEST" = "1" ]; then echo "code=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python projects/_radar/run_edition.py $ED check
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Fetch (waits for the close unless test)
        id: fetch
        if: steps.guard.outputs.skip == 'false' && steps.check.outputs.code == '0'
        run: |
          set +e
          if [ "$RADAR_TEST" = "1" ]; then python projects/_radar/run_edition.py $ED fetch; else python projects/_radar/run_edition.py $ED fetch --wait; fi
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Cross-check (Kanz for EGX if the secret is set, else Yahoo only)
        if: steps.fetch.outputs.code == '0'
        env:
          KANZ_DB_URL: ${{ secrets.KANZ_DB_URL }}
        run: python cloud/validate.py $ED
      - name: Render
        if: steps.fetch.outputs.code == '0'
        run: python projects/_radar/run_edition.py $ED render
      - name: Checks and validation note
        id: fin
        if: steps.fetch.outputs.code == '0'
        run: |
          python cloud/finish.py $ED "out/${{ steps.guard.outputs.date }}"
          S=$(python -c "import json;print(json.load(open('finish.json'))['status'])")
          echo "status=$S" >> "$GITHUB_OUTPUT"
          if [ "$S" = "OK" ] || [ "$S" = "SINGLE SOURCE" ] || { [ "$RADAR_TEST" = "1" ] && [ "$SITE_TEST" = "true" ]; }; then echo "site=true" >> "$GITHUB_OUTPUT"; else echo "site=false" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release (public when OK or SINGLE SOURCE, draft when NEEDS REVIEW or test)
        if: steps.fetch.outputs.code == '0'
        id: rel
        run: |
          D=${{ steps.guard.outputs.date }}
          T=${{ steps.guard.outputs.tag }}
          DRAFT=$(python -c "import json;print('' if json.load(open('finish.json'))['status'] in ('OK','SINGLE SOURCE') else '--draft')")
          if [ "$ED" = "us" ]; then TITLE="Europe + US close reel $D"; else TITLE="EGX close reel $D"; fi
          [ "$RADAR_TEST" = "1" ] && TITLE="$TITLE (test)"
          gh release create "$T" out/$D/* $DRAFT --title "$TITLE" --notes "$(python -c "import json;print(json.load(open('finish.json'))['line'])")"
          echo "url=$(gh release view "$T" --json url -q .url)" >> "$GITHUB_OUTPUT"
      - name: Upload as run artifact too
        if: steps.fetch.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ED }}-reel-${{ steps.guard.outputs.date }}
          path: out/${{ steps.guard.outputs.date }}/
          retention-days: 14
      - name: Configure website
        if: steps.fin.outputs.site == 'true'
        id: cfg
        uses: actions/configure-pages@v5
      - name: Build website (this edition + the other one carried over from the live site)
        if: steps.fin.outputs.site == 'true'
        run: python cloud/build_site.py $ED "out/${{ steps.guard.outputs.date }}" _site "${{ steps.cfg.outputs.base_url }}"
      - name: Upload website
        if: steps.fin.outputs.site == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        if: steps.fin.outputs.site == 'true'
        id: pages
        uses: actions/deploy-pages@v4
      - name: Slack
        if: steps.fetch.outputs.code == '0'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.rel.outputs.url }}
        run: python cloud/slack_notify.py $ED "out/${{ steps.guard.outputs.date }}"
      - name: Slack on failure
        if: failure() && steps.guard.outputs.skip == 'false'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MSG=":x: $ED close reel failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            curl -sS -H "Authorization: Bearer $SLACK_BOT_TOKEN" --data-urlencode "channel=$SLACK_CHANNEL_ID" --data-urlencode "text=$MSG" https://slack.com/api/chat.postMessage
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H "Content-Type: application/json" --data "{\"text\":\"$MSG\"}" "$SLACK_WEBHOOK_URL"
          else echo "no Slack secret"; fi
