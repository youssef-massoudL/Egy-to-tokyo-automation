<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Kanz Market Radar: أسواق الغرب · من أوروبا لنيويورك</title>
<link rel="stylesheet" href="../../runtime/kanz.css">
<link rel="stylesheet" href="../../runtime/kanz-look.css">
<link rel="stylesheet" href="../_radar/radar.css">
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div id="headline"></div>
  <div id="captions"></div>
  <div id="overlay"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>
<svg width="0" height="0" style="position:absolute">
  <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence class="boil" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="build/timing.js"></script>
<script src="assets/map-data.js"></script>
<script src="../../runtime/kanz.js"></script>
<script src="../../runtime/kanz-look.js"></script>
<script src="assets/photo/manifest.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="../_radar/scene.js"></script>
</body>
</html>
